name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transactions_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transactions_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/transactions_test
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Verify lock file
        run: poetry check --lock

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy app migrations tests scripts

      - name: Test
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=xml

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: transaction-webhook-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
